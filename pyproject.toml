[project]
name = "jp-netprint"
version = "0.2.0"
description = "Unified CLI/library for Japan konbini print services — 7-Eleven (lite.printing.ne.jp), Sharp Network Print / Lawson family (networkprint.ne.jp), and pic-chan ID photos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "qrcode[pil]>=7.4",
]

[project.scripts]
netprint = "netprint_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netprint_cli"]
