[project]
name = "jp-netprint"
version = "0.1.0"
description = "CLI for Japan 7-Eleven かんたん netprint (lite.printing.ne.jp)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "qrcode[pil]>=7.4",
]

[project.scripts]
netprint = "netprint_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netprint_cli"]
